<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Synthetic source-component fixture</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../stage.css">
<style>body{font:16px system-ui;margin:24px;color:#19232b}.ps-stage{width:min(720px,100%);min-height:280px;background:#f3f5f8}main{padding:24px}h1{font-size:24px;margin:0 0 24px}form{display:grid;gap:16px}label{display:grid;gap:8px}input,button{font:inherit;padding:12px;box-sizing:border-box;width:100%}p{min-height:24px;margin:0}ul{margin:0;padding-left:24px}</style>
<section class="ps-stage ss-stage" data-mark="ready"><main class="ps-camera"><h1>Contact fixture</h1><div id="component"></div></main></section>
<script type="module">
import { mountContactForm } from './contact-form.mjs'
// Explicit transport boundary, manually resolved by the fixture runner.
window.requests = []; window.persisted = []
const service = { create(input) { return new Promise((resolve, reject) => {
  window.requests.push({ input, resolve: () => { const saved = { id: 'fixture-contact-1', ...input }; window.persisted.push(saved); resolve(saved) }, reject: () => reject(new Error('fixture failure')) })
}) } }
window.state = mountContactForm(document.querySelector('#component'), service)
window.fixtureReady = true
</script>
