name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install '.[mcp,test]' build
      - run: npm --prefix ui ci && npm --prefix ui run build
      - run: git diff --exit-code -- src/pocket_studio/ui/review.html
      - run: python -m playwright install --with-deps chromium
      - run: pocket-studio --json doctor
      - name: Test with the runner's full Chrome (H.264 and AAC playback)
        run: |
          export POCKET_CHROMIUM="$(command -v google-chrome)"
          test -x "$POCKET_CHROMIUM"
          "$POCKET_CHROMIUM" --version
          python -m unittest discover -s tests -v
      - run: python -m build
      - name: Install CLI-only wheel outside checkout
        run: |
          python -m venv /tmp/pocket-wheel
          /tmp/pocket-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/pocket-wheel/bin/pocket-studio --json doctor
          /tmp/pocket-wheel/bin/pocket-studio init /tmp/wheel-film --title 'Wheel test'
          /tmp/pocket-wheel/bin/pocket-studio inspect --project /tmp/wheel-film
