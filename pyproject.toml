[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-studio"
version = "0.1.0"
description = "Local production primitives for agent-authored motion films"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/xpriment626/pocket-studio"

[project.scripts]
pocket-studio = "pocket_studio.cli:main"
pocket-studio-mcp = "pocket_studio.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
test = ["playwright>=1.50,<2"]

[tool.setuptools.package-data]
pocket_studio = ["ui/*.html", "ui/*.txt"]
