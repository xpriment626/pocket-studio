<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pocket Studio review</title>
<style>
:root{color-scheme:light dark}body{margin:16px;font:14px system-ui;background:var(--color-background-primary,Canvas);color:var(--color-text-primary,CanvasText)}main{max-width:880px;margin:auto}video{width:100%;max-height:55vh;background:#111}label{display:block;margin:12px 0 4px}select,textarea,button{font:inherit;padding:8px}textarea{box-sizing:border-box;width:100%;min-height:70px}button{margin:8px 8px 0 0}code{overflow-wrap:anywhere;font-size:11px}#status{min-height:2em}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid Highlight}p{overflow-wrap:anywhere}
</style></head><body><main><h1>Version review</h1><label for="version">Version A / B</label><select id="version" disabled></select><p><code id="identity"></code></p><video id="player" controls playsinline preload="metadata"></video><p id="clock">0.00 s</p><p id="media-error" role="alert"></p><p id="approval"></p><label for="note">Timestamped note</label><textarea id="note" placeholder="What should change at this moment?"></textarea><p>Actions capture the active player's current time. Human attribution is caller supplied.</p><button id="revise" disabled>Request revision</button><button id="approve" disabled>Approve this version</button><p id="status" role="status" aria-live="polite">Connecting to review host…</p></main><script type="module">/* BUNDLE */</script></body></html>
